name: Ripple SuperNeuron RNA scientific software checks

on:
  pull_request:
    paths:
      - "ripple/superneuron-rna-alpha-v0.1/**"
      - ".github/workflows/ripple-superneuron-rna.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check source and run controlled numerical tests
        shell: bash
        run: |
          cd ripple/superneuron-rna-alpha-v0.1
          python -m unittest discover -s tests -v
          python superneuron.py benchmark \
            --fasta data/RHO_NM_000539.3_mirror.fasta \
            --samples 800 --output results/independent_benchmark.json
          python - <<'PY'
          from pathlib import Path
          from superneuron import parse_fasta
          import json
          seq=parse_fasta(Path("data/RHO_NM_000539.3_mirror.fasta").read_text(),"NM_000539.3")
          assert seq["sha256"]=="b7f4dbb8b20975eab3ea535177e97ad0b3beab7b99e2aec4f98eb2af5bb89db3"
          result=json.loads(Path("results/independent_benchmark.json").read_text())
          assert result["search_space_exact"]==4**29
          assert result["simulated_candidate_genotypes"]==800
          assert result["population_evaluations"]==833
          assert result["all_regulators_have_nonzero_numerical_effect"]
          assert result["status"]=="EXECUTED_SYNTHETIC_SOFTWARE"
          previous=json.loads(Path("results/benchmark.json").read_text())
          for key in ("original","controls","regulator_ablation","candidate_event_distribution"):
              assert result[key]==previous[key],key
          print("Code, RHO transcript SHA, numeric ablation and replay verified.")
          PY
      - name: Verify six genuine NCBI gene inputs and 174 causal software regulators
        shell: bash
        run: |
          cd ripple/superneuron-rna-alpha-v0.1
          python superneuron_multigene.py --output results/independent_multigene.json
          python - <<'PY'
          from pathlib import Path
          from superneuron_multigene import load_genes,GENES
          import json
          genes=load_genes(Path('data/ncbi_genes'))
          assert set(genes)==set(GENES)
          result=json.loads(Path('results/independent_multigene.json').read_text())
          assert result['actual_evaluations']==154
          assert result['gene_loci_executed']==174
          assert result['all_added_loci_causal']
          previous=json.loads(Path('results/multigene_benchmark.json').read_text())
          import math
          def parity(a,b,at='root'):
              assert type(a) is type(b),(at,type(a),type(b))
              if isinstance(a,dict):
                  assert a.keys()==b.keys(),at
                  for k in a: parity(a[k],b[k],f'{at}/{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b),at
                  for i,(x,y) in enumerate(zip(a,b)): parity(x,y,f'{at}/{i}')
              elif isinstance(a,float):
                  assert math.isclose(a,b,rel_tol=1e-9,abs_tol=1e-12),(at,a,b)
              else:
                  assert a==b,(at,a,b)
          for key in ('gene_family_ablation','individual_locus_ablation','energy_sustained', 'original_multigene_events'):
              parity(result[key],previous[key],key)
          print('Six NCBI mRNAs, 174 causal loci, 145 individual knockouts verified.')
          PY
      - name: Compare mirrored human RHO transcript to NCBI RefSeq
        continue-on-error: true
        shell: bash
        run: |
          cd ripple/superneuron-rna-alpha-v0.1
          python data/verify_ncbi.py
      - name: Preserve NCBI source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superneuron-ncbi-provenance
          path: ripple/superneuron-rna-alpha-v0.1/results/ncbi_provenance.json
      - name: Collect human cone and visual-cycle RefSeq transcripts
        continue-on-error: true
        shell: bash
        run: |
          cd ripple/superneuron-rna-alpha-v0.1
          python data/collect_reference_genes.py
      - name: Preserve NCBI human vision-gene inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superneuron-five-human-genes
          path: |
            ripple/superneuron-rna-alpha-v0.1/data/ncbi_genes/*.fasta
            ripple/superneuron-rna-alpha-v0.1/results/ncbi_gene_catalog.json
      - name: Preserve six-gene numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: superneuron-six-gene-experiment
          path: ripple/superneuron-rna-alpha-v0.1/results/independent_multigene.json
      - name: Preserve numerical benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: superneuron-synthetic-benchmark
          path: ripple/superneuron-rna-alpha-v0.1/results/independent_benchmark.json



