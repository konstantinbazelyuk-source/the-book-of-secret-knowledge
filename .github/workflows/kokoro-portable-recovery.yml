name: Kokoro portable source recovery
on:
  push:
    branches: ['research/kokoro-motion-delivery-20261102']
    paths: ['.github/workflows/kokoro-portable-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Fetch and verify saved source
        run: |
          set -euo pipefail
          mkdir -p recovered
          curl -fSL --connect-timeout 20 --max-time 60 --retry 1 -o recovered/audit-source.zip 'https://ripple-neuron-phone.floot.app/_cdn/static/Kokoro_Runtime_Audit_Source_20261102.zip'
          echo '662d220244fb5973f89ae49ff123819c5c764313ef2662a56b0871308b401af9  recovered/audit-source.zip' | sha256sum -c -
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('recovered/audit-source.zip') as z:
              assert z.testzip() is None
              for p in z.namelist():
                  assert not pathlib.PurePosixPath(p).is_absolute() and '..' not in pathlib.PurePosixPath(p).parts
              z.extractall('recovered/source')
          for n in ['export_first.py','repair_export.py','attach_anchors.py','sample_controls.py','web/package.json','browser_env.json']:
              print('\nFILE '+n+'\n'+pathlib.Path('recovered/source',n).read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-portable-recovered-source
          path: recovered/
          retention-days: 1
          if-no-files-found: error
