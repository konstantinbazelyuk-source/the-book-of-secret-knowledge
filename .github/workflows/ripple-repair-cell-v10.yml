name: Ripple Repair native Android, Windows and algorithm verification
on:
  push:
    branches: [research/ripple-repair-cell-v1_0]
    paths:
      - 'research/ripple-repair-cell-v1_0/**'
      - '.github/workflows/ripple-repair-cell-v10.yml'
permissions:
  contents: read
jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract SHA-256-verified source
        run: |
          python - <<'PY'
          import base64,hashlib,zipfile,pathlib,io
          blob=base64.b64decode(pathlib.Path('research/ripple-repair-cell-v1_0/source_bundle.b64').read_text().strip(),validate=True)
          digest=hashlib.sha256(blob).hexdigest()
          assert digest=='17be9c3252fda975427fcdff67da7b721e38049618a7a0d952bae0d9a8e86856',digest
          z=zipfile.ZipFile(io.BytesIO(blob));assert z.testzip() is None;z.extractall('ripple_src')
          print('VERIFIED BUNDLE:',digest)
          PY
      - name: Run unit, HTTP and Python↔Java tests plus recorded study
        run: |
          cd ripple_src
          PYTHONPATH=. python -m unittest discover -s tests -q
          PYTHONPATH=. python tools/run_study.py results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripple-repair-cloud-study
          path: ripple_src/results/experiment.json
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu image already supplies Android cmdline tools.
      # Avoid setup-android attempting the removed legacy 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 with explicit command-line tools path
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract verified source
        run: |
          python - <<'PY'
          import base64,hashlib,zipfile,pathlib,io
          blob=base64.b64decode(pathlib.Path('research/ripple-repair-cell-v1_0/source_bundle.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(blob).hexdigest()=='17be9c3252fda975427fcdff67da7b721e38049618a7a0d952bae0d9a8e86856'
          zipfile.ZipFile(io.BytesIO(blob)).extractall('ripple_src')
          PY
      - name: Compile actual Android debug APK
        run: |
          cd ripple_src/android
          gradle --no-daemon :app:assembleDebug
      - name: Verify Android debug APK signature and package
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose ripple_src/android/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging ripple_src/android/app/build/outputs/apk/debug/app-debug.apk | head -12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RippleRepair-Android-debug-APK
          path: ripple_src/android/app/build/outputs/apk/debug/*.apk
  windows-desktop-exe:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract verified source
        shell: pwsh
        run: |
          python -c "import pathlib,base64,hashlib,zipfile,io; b=base64.b64decode(pathlib.Path('research/ripple-repair-cell-v1_0/source_bundle.b64').read_text().strip()); assert hashlib.sha256(b).hexdigest()=='17be9c3252fda975427fcdff67da7b721e38049618a7a0d952bae0d9a8e86856'; zipfile.ZipFile(io.BytesIO(b)).extractall('ripple_src')"
      - name: Build standalone Windows application
        shell: pwsh
        run: |
          cd ripple_src
          python -m pip install pyinstaller==6.11.0
          python -m PyInstaller --clean --noconfirm --onefile --windowed --add-data "web;web" --name RippleRepair launch_desktop.py
      - name: Launch built Windows EXE and verify actual local UI
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'ripple_src\\dist\\RippleRepair.exe'
          $p = Start-Process -FilePath $exe -PassThru
          $verified = $false
          try {
            for ($i=0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 1
              try {
                $reply = Invoke-WebRequest -Uri 'http://127.0.0.1:8879/' -TimeoutSec 2 -UseBasicParsing
                if ($reply.StatusCode -eq 200 -and $reply.Content -match 'Ripple Repair') { $verified = $true; break }
              } catch { }
            }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $verified) { throw 'The compiled Windows executable did not serve its working local UI' }
          Write-Host 'WINDOWS EXECUTABLE BOOT/HTTP SMOKE PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RippleRepair-Windows-EXE
          path: ripple_src/dist/RippleRepair.exe
