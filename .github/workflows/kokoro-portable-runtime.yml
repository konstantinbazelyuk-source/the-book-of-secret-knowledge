name: Kokoro portable GLB runtime
on:
  push:
    branches: ['research/kokoro-motion-delivery-20261102']
    paths: ['.github/workflows/kokoro-portable-runtime.yml', 'kokoro/portable_runtime/*.py']
permissions:
  contents: write
concurrency:
  group: kokoro-portable-runtime-isolated
  cancel-in-progress: true
jobs:
  convert_and_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare pinned conversion inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb python3-tk libgl1 libegl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          python3 -m pip install 'numpy==1.26.4' 'Pillow==11.3.0'
          mkdir -p "$RUNNER_TEMP/kokoro-inputs" "$RUNNER_TEMP/kokoro-delivery"
          cd "$RUNNER_TEMP/kokoro-inputs"
          curl -fSL --retry 1 --connect-timeout 20 --max-time 100 -o audit.zip 'https://ripple-neuron-phone.floot.app/_cdn/static/Kokoro_Runtime_Audit_Source_20261102.zip'
          curl -fSL --retry 1 --connect-timeout 20 --max-time 180 -o native.zip 'https://ripple-neuron-phone.floot.app/_cdn/static/Kokoro_Blender_Source_Rig_v0_3_20261102.zip'
          curl -fSL --retry 1 --max-time 240 -O 'https://download.blender.org/release/Blender3.4/blender-3.4.1-linux-x64.tar.xz'
          curl -fsSL --retry 1 --max-time 60 -o blender.sha256 'https://download.blender.org/release/Blender3.4/blender-3.4.1.sha256'
          grep 'blender-3.4.1-linux-x64.tar.xz$' blender.sha256 | sha256sum -c -
          tar -xf blender-3.4.1-linux-x64.tar.xz
          echo "KOKORO_BLENDER=$RUNNER_TEMP/kokoro-inputs/blender-3.4.1-linux-x64/blender" >> "$GITHUB_ENV"
          echo "KOKORO_AUDIT_ZIP=$RUNNER_TEMP/kokoro-inputs/audit.zip" >> "$GITHUB_ENV"
          echo "KOKORO_NATIVE_ZIP=$RUNNER_TEMP/kokoro-inputs/native.zip" >> "$GITHUB_ENV"
          echo "KOKORO_DELIVERY_OUT=$RUNNER_TEMP/kokoro-delivery" >> "$GITHUB_ENV"
          command -v google-chrome || command -v chromium
      - name: Convert model and test runtime without native source
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 kokoro/portable_runtime/finish_runtime.py
      - name: Preserve small review media on the existing isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/kokoro-motion-delivery-20261102'
          mkdir -p kokoro/portable_runtime/preview
          cp "$KOKORO_DELIVERY_OUT"/*.gif "$KOKORO_DELIVERY_OUT"/*.mp4 "$KOKORO_DELIVERY_OUT"/REPRODUCTION_RESULT.json kokoro/portable_runtime/preview/
          cp "$KOKORO_DELIVERY_OUT/Kokoro_Portable_Runtime_v0_1/README.md" kokoro/portable_runtime/README.md
          git config user.name 'Kokoro research runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kokoro/portable_runtime/preview kokoro/portable_runtime/README.md
          git diff --cached --quiet || git commit -m 'evidence(kokoro): verified non-Blender GLB runtime and captured motion'
          git push origin HEAD:refs/heads/research/kokoro-motion-delivery-20261102
      - name: Preserve runtime and complete verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-portable-runtime-output
          path: |
            ${{ runner.temp }}/kokoro-delivery/
            /tmp/kokoro_runtime_transfer_20261102/audit_20261102/
          retention-days: 1
          if-no-files-found: warn
