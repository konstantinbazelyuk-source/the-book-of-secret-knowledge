name: Kokoro pinned whole-system input recovery
on:
  push:
    branches: ['research/kokoro-portable-runtime-20261102']
    paths: ['.github/workflows/kokoro-whole-system-inputs-20261104.yml']
permissions:
  contents: read
concurrency:
  group: kokoro-whole-system-input-recovery-20261104
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch and verify existing public assets, no private Core uploads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,urllib.request,tarfile
          out=pathlib.Path('inputs')
          base='https://ripple-neuron-phone.floot.app/_cdn/static/'
          expected={'Kokoro_Runtime_v0_2.glb':'952fdb427cbfa3f0030134d32b8260bf1ca0001928748806bfe8a682855fdcaa','Kokoro_Runtime_Controls_v0_2.json':'32d5010adac6c733225b04e3611e5286dceba9c5427304f4a3ffb0f0d9105ff8'}
          sources={}
          def get(url):
              with urllib.request.urlopen(url,timeout=60) as r:return r.read()
          for name,pin in expected.items():
              data=get(base+name)
              assert hashlib.sha256(data).hexdigest()==pin,(name,'changed published asset')
              (out/name).write_bytes(data);sources[name]={'url':base+name,'sha256':pin,'bytes':len(data)}
          controls=json.loads((out/'Kokoro_Runtime_Controls_v0_2.json').read_text())
          assert controls['glb_sha256']==expected['Kokoro_Runtime_v0_2.glb']
          assert controls['source_sha256']=='be9cb6b2575334ff912f45a9ff226a552f7216d2b1d7707ba830f8867690ce93'
          version=json.loads(get('https://registry.npmjs.org/three/0.180.0'))
          url=version['dist']['tarball'];assert url=='https://registry.npmjs.org/three/-/three-0.180.0.tgz'
          tar=get(url);algorithm,wanted=version['dist']['integrity'].split('-',1);assert algorithm=='sha512'
          assert base64.b64encode(hashlib.sha512(tar).digest()).decode()==wanted
          (out/'three-0.180.0.tgz').write_bytes(tar)
          sources['three-0.180.0.tgz']={'url':url,'sha256':hashlib.sha256(tar).hexdigest(),'bytes':len(tar),'registry_integrity':version['dist']['integrity']}
          url='https://raw.githubusercontent.com/konstantinbazelyuk-source/the-book-of-secret-knowledge/5bcd243bb8b286e68f81d65091ed8860fff1ccb5/kokoro/portable_runtime/control-review.html'
          data=get(url);(out/'control-review-original.html').write_bytes(data)
          sources['control-review-original.html']={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          (out/'retrieval_manifest.json').write_text(json.dumps({'kind':'verified source retrieval, NOT capability or runtime verification','source_commit':'5bcd243bb8b286e68f81d65091ed8860fff1ccb5','sources':sources},indent=2))
          print(json.dumps(sources,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-whole-system-pinned-inputs
          path: inputs/
          if-no-files-found: error
          retention-days: 3
