name: Ripple isolated evolution cloud check
on:
  push:
    branches: [research/ripple-cloud-evolution-v1_2]
    paths:
      - '.github/workflows/ripple-cloud-evolution.yml'
      - 'research/ripple-cloud-evolution/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/ripple-cloud-evolution/verify_cloud.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripple-cloud-evolution-verification
          path: research/ripple-cloud-evolution/results_cloud.json
