class Ripple{constructor(){this.theta=.45;this.t=0;this.u=0;this.rate=0;this.rest=0;}step(x,dt){const[r,g,b]=x.map(v=>clamp(v,0,1)),drive=2*r+1.2*g-1.4*b,start=this.t,events=[];let elapsed=0;while(elapsed<dt-1e-12){let left=dt-elapsed;if(this.rest>1e-12){let held=Math.min(left,this.rest);this.rest=Math.max(0,this.rest-held);this.u=0;elapsed+=held;continue;}let crossing=Infinity;if(this.u>=this.theta)crossing=0;else if(drive>this.theta)crossing=.5*Math.log((drive-this.u)/(drive-this.theta));if(crossing<=left+1e-12){elapsed+=Math.max(0,Math.min(left,crossing));events.push(start+elapsed);this.u=0;this.rest=.1;}else{this.u=Math.max(0,drive+(this.u-drive)*Math.exp(-left/.5));elapsed=dt;}}let decay=Math.exp(-dt/5),integral=this.rate*5*(1-decay);this.rate*=decay;for(const event of events){let d=Math.exp(-(start+dt-event)/5);this.rate+=d/5;integral+=1-d;}this.theta=clamp(this.theta+.08*(integral-G.event_target*dt),.15,2.5);this.t=start+dt;return{count:events.length};}}

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});const drawHeight=innerWidth<600?Math.min(innerHeight*.65,560):innerHeight;renderer.setSize(innerWidth,drawHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x121522);scene.add(new THREE.HemisphereLight(0xe4eeff,0x665577,.8));let light=new THREE.DirectionalLight(0xffffff,1.8);light.position.set(2,4,5);scene.add(light);scene.environment=null;let camera=new THREE.PerspectiveCamera(36,innerWidth/drawHeight,.01,100);camera.position.set(.3,1.1,3.1);let orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.85,0);orbit.update();const[modelBytes,controlData]=await Promise.all([fetch('https://ripple-neuron-phone.floot.app/_cdn/static/Kokoro_Runtime_v0_2.glb').then(r=>{if(!r.ok)throw Error('Model load failed');return r.arrayBuffer()}),fetch('https://ripple-neuron-phone.floot.app/_cdn/static/Kokoro_Runtime_Controls_v0_2.json').then(r=>{if(!r.ok)throw Error('Controls load failed');return r.json()})]);const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',modelBytes)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!==controlData.glb_sha256)throw Error('Model and controls do not match');const gltf=await new GLTFLoader().parseAsync(modelBytes,'');gltf.scene.traverse(o=>{if(o.isMesh){if(o.geometry.boundingBox===null)o.geometry.computeBoundingBox();let sz=new THREE.Vector3();o.geometry.boundingBox.getSize(sz);if(sz.x>10||sz.z>10)o.visible=false;const convert=m=>new THREE.MeshStandardMaterial({name:m.name+' compatibility',color:m.color,roughness:.65,metalness:.12,map:m.map,vertexColors:m.vertexColors,emissiveMap:m.emissiveMap,side:THREE.DoubleSide,emissive:m.emissive,emissiveIntensity:Math.min(m.emissiveIntensity||0,1),transparent:m.transparent,opacity:m.opacity});o.material=Array.isArr
