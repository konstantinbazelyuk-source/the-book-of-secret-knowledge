[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digestive-memory"
version = "0.1.0"
description = "Inspectable source-linked AI memory inspired by selective digestion"
requires-python = ">=3.10"
authors = [{name = "Konstantin Bazelyuk"}]
dependencies = []

[project.optional-dependencies]
reports = ["matplotlib>=3.7", "reportlab>=4", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["digestive_memory*"]
