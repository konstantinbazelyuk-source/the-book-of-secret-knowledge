<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kokoro Gaussian Bust</title><style>body{margin:0;background:#101625;color:#e6e9f3;font:15px system-ui}main{display:grid;grid-template-columns:1fr 290px;gap:12px;padding:15px}canvas{width:100%;height:80vh;background:#172235;border-radius:12px}aside{display:grid;align-content:start;gap:15px}label{display:grid;gap:6px}input{width:100%}button{padding:10px;background:#34496b;color:white;border:0;border-radius:8px}@media(max-width:750px){main{grid-template-columns:1fr}canvas{height:55vh}}</style></head><body><main><canvas id="view" width="900" height="700"></canvas><aside><h2>Kokoro — Gaussian Bust</h2><label>Head yaw<input id="yaw" type="range" min="-45" max="45" value="0"></label><label>Head pitch<input id="pitch" type="range" min="-25" max="25" value="0"></label><label>Gaze<input id="gaze" type="range" min="-100" max="100" value="0"></label><label>Mouth<input id="mouth" type="range" min="0" max="100" value="0"></label><label>Blink<input id="blink" type="range" min="0" max="100" value="0"></label><label>Kernel scale<input id="kernel" type="range" min="25" max="150" value="85"></label><button id="auto">Toggle automated motion</button><p id="status"></p><small>Procedural Gaussian primitive rasterization with alpha accumulation. Not trained 3D Gaussian splatting, not the archived Lumina GLB.</small></aside></main>
<script type="module">
import {createBust,deformBust,projectGaussians} from './bust.mjs';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),model=createBust(),cam={eye:[0,1.4,4.2],look:[0,1.25,0],aspect:900/700,fov:50};let auto=true,frames=0,last=performance.now();
$('auto').onclick=()=>auto=!auto;
function frame(now){const t=now/1000,r=Math.PI/180,pose={yaw:Number($('yaw').value)*r,pitch:Number($('pitch').value)*r,gazeX:Number($('gaze').value)/100,mouth:Number($('mouth').value)/100,blink:Number($('blink').value)/100};
if(auto){pose.yaw+=.14*Math.sin(t*.6);pose.pitch+=.045*Math.sin(t*.8);pose.mouth=Math.max(pose.mouth,.2+.2*Math.sin(t*3));pose.blink=Math.max(pose.blink,Math.max(0,1-Math.abs(Math.sin(t*.7))*35))}
const pts=projectGaussians(deformBust(model,t,pose),cam),scale=Number($('kernel').value)/100;
ctx.clearRect(0,0,900,700);for(const p of pts){const x=(p.screen.x+1)*450,y=(1-p.screen.y)*350,rad=Math.max(1,Math.min(32,p.sigma*450*scale));if(x<-40||x>940||y<-40||y>740)continue;const grad=ctx.createRadialGradient(x,y,0,x,y,rad*2.5);const c=p.color;grad.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},.65)`);grad.addColorStop(.45,`rgba(${c[0]},${c[1]},${c[2]},.3)`);grad.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,rad*2.5,0,Math.PI*2);ctx.fill()}
frames++;if(now-last>=1000){$('status').textContent=`${pts.length} projected Gaussian primitives · ${(frames*1000/(now-last)).toFixed(1)} FPS`;last=now;frames=0}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
