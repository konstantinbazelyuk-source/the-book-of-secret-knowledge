<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kokoro XYZ Space-Time Laboratory</title><style>
body{background:#0b1420;color:#e3edf7;font:15px system-ui;margin:0}header{padding:12px 20px;background:#182438}main{display:grid;grid-template-columns:minmax(300px,1fr) 300px;gap:12px;padding:12px}canvas{width:100%;height:min(80vh,780px);border-radius:12px;background:#101c2d}aside{background:#182438;padding:15px;border-radius:12px;display:flex;flex-direction:column;gap:12px}label{display:grid;gap:4px}select,input,button{padding:9px;border-radius:6px;background:#24364d;color:#fff;border:1px solid #516a83}button{cursor:pointer}small{color:#aabdd0}pre{white-space:pre-wrap;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr}canvas{height:55vh}}</style></head>
<body><header><strong>Kokoro — XYZ Space-Time Laboratory</strong> <small>3D geometry · temporal skeleton · point samples · perspective camera</small></header>
<main><canvas id="scene" width="960" height="760"></canvas><aside>
<label>Behavior<select id="behavior"><option>idle</option><option>greet</option><option>explain</option><option>celebrate</option></select></label>
<label>Point density<input id="density" type="range" min="3" max="18" value="9"></label>
<label>Motion intensity<input id="intensity" type="range" min="0" max="100" value="70"></label>
<label>Orbit camera<input id="orbit" type="range" min="-180" max="180" value="18"></label>
<label>Camera elevation<input id="elevation" type="range" min="-45" max="65" value="10"></label>
<label><input id="bones" type="checkbox" checked>Show skeletal joints</label>
<button id="export">Export XYZ pose and point cloud</button><pre id="info"></pre><small>Procedural 3D geometry, not the archived Lumina GLB. No AI model or learned Viggle motion is claimed.</small></aside></main>
<script type="module">
import {skeletonPose,sampleBoneCloud,projectCloud,perspective} from './xyz.mjs';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let latest=null,frames=0,lastTime=performance.now(),fps=0;
function camera(){const a=Number($('orbit').value)*Math.PI/180,e=Number($('elevation').value)*Math.PI/180,r=4.4;return {eye:[r*Math.sin(a)*Math.cos(e),1.3+r*Math.sin(e),r*Math.cos(a)*Math.cos(e)],look:[0,1.15,0],aspect:canvas.width/canvas.height,fov:48}}
function xy(v){return [canvas.width*(v.x+1)/2,canvas.height*(1-v.y)/2]}
function draw(now){ctx.clearRect(0,0,canvas.width,canvas.height);const t=now/1000,cam=camera(),joints=skeletonPose(t,$('behavior').value,Number($('intensity').value)/100),pts=sampleBoneCloud(joints,{rings:Number($('density').value),sides:12}),projected=projectCloud(pts,cam);
ctx.lineWidth=1;ctx.strokeStyle='#34516d';for(let i=-5;i<=5;i++){for(const pair of [[[i,0,-5],[i,0,5]],[[-5,0,i],[5,0,i]]]){const a=perspective(pair[0],cam),b=perspective(pair[1],cam);if(a&&b){const p=xy(a),q=xy(b);ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke()}}}
for(const p of projected){const [x,y]=xy(p.projected);const r=Math.max(.7,Math.min(4.5,12/p.projected.depth));ctx.fillStyle=p.bone.includes('head')?'#f1c5df':p.bone.includes('chest')||p.bone.includes('spine')?'#a0d9e8':'#85b7ed';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
if($('bones').checked){const m=new Map(joints.map(j=>[j.name,j]));ctx.strokeStyle='#ffd27d';ctx.lineWidth=3;for(const j of joints){if(!j.parent)continue;const a=perspective(j.position,cam),b=perspective(m.get(j.parent).position,cam);if(a&&b){ctx.beginPath();ctx.moveTo(...xy(a));ctx.lineTo(...xy(b));ctx.stroke()}}for(const j of joints){const p=perspective(j.position,cam);if(p){ctx.fillStyle='#ffe8ad';ctx.beginPath();ctx.arc(...xy(p),4,0,Math.PI*2);ctx.fill()}}}
latest={time:t,behavior:$('behavior').value,joints,points:pts.map(p=>p.position)};frames++;if(now-lastTime>=1000){fps=(frames*1000/(now-lastTime)).toFixed(1);frames=0;lastTime=now;$('info').textContent=`3D joints: ${joints.length}\nXYZ points: ${pts.length}\nFrame rate: ${fps} FPS\nCamera: ${cam.eye.map(x=>x.toFixed(2)).join(', ')}`}requestAnimationFrame(draw)}
requestAnimationFrame(draw);
$('export').onclick=()=>{if(!latest)return;const blob=new Blob([JSON.stringify(latest)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kokoro-xyz-pose.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
</script></body></html>
